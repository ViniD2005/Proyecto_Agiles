# EduMonitor AI - entorno completo (HU-03)
# Uso:  cp .env.example .env   &&   docker compose up -d --build
name: edumonitor

services:
  # ---------------- Infraestructura ----------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: em-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [sqlserver_data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: em-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Moodle de prueba (HU-01) ----------------
  # Nota: Bitnami movió sus imágenes gratuitas a "bitnamilegacy". Si el pull falla,
  # revisar docs/GUIA_MOODLE.md -> "Imagen alternativa".
  mariadb:
    image: bitnamilegacy/mariadb:11.4
    container_name: em-mariadb
    environment:
      MARIADB_USER: bn_moodle
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: bitnami_moodle
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes: [mariadb_data:/bitnami/mariadb]

  moodle:
    image: bitnamilegacy/moodle:4.5
    container_name: em-moodle
    depends_on: [mariadb]
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: bn_moodle
      MOODLE_DATABASE_PASSWORD: ${MARIADB_PASSWORD}
      MOODLE_DATABASE_NAME: bitnami_moodle
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_SITE_NAME: "Moodle de prueba - EduMonitor AI"
      MOODLE_LANG: es
    ports: ["8081:8080"]
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata

  # ---------------- Sprint 3: IA local y correo de pruebas (opcionales por perfil) ----------------
  # Ollama dentro de Docker:  docker compose --profile ia up -d   y en .env  LLM_BASE_URL=http://ollama:11434
  # (si Ollama ya está instalado en el equipo no hace falta este perfil; el valor por defecto apunta al equipo)
  ollama:
    image: ollama/ollama:latest
    container_name: em-ollama
    profiles: ["ia"]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  # Bandeja de correo de pruebas (HU-20):  docker compose --profile correo up -d   →  http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: em-mailpit
    profiles: ["correo"]
    ports: ["8025:8025", "1025:1025"]

  # ---------------- Microservicios .NET 8 ----------------
  identity-api:   # MS-A Identidad y Auditoria
    build:
      context: .
      dockerfile: src/Services/Identity/EduMonitor.Identity.Api/Dockerfile
    container_name: em-identity
    depends_on:
      sqlserver: { condition: service_healthy }
    environment: &common-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}
      ConnectionStrings__Default: Server=sqlserver,1433;Database=DB_Identidad;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Seed__DefaultPassword: ${SEED_DEFAULT_PASSWORD}
    ports: ["5001:8080"]

  academic-api:   # MS-B Academico (Moodle + estructura tematica)
    build:
      context: .
      dockerfile: src/Services/Academic/EduMonitor.Academic.Api/Dockerfile
    container_name: em-academic
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity-api: { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ConnectionStrings__Default: Server=sqlserver,1433;Database=DB_Academico;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      Moodle__BaseUrl: http://moodle:8080
      Moodle__Token: ${MOODLE_TOKEN}
      Audit__IdentityUrl: http://identity-api:8080/
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports: ["5002:8080"]

  analytics-api:  # MS-C Analitica, Agente IA, recomendaciones y reportes
    build:
      context: .
      dockerfile: src/Services/Analytics/EduMonitor.Analytics.Api/Dockerfile
    container_name: em-analytics
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity-api: { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ConnectionStrings__Default: Server=sqlserver,1433;Database=DB_Analitica;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Sprint 3: auditoría, contacto del estudiante (MS-B), agente de IA, correo y reportes
      Audit__IdentityUrl: http://identity-api:8080/
      Academic__BaseUrl: http://academic-api:8080/
      Llm__Provider: ${LLM_PROVIDER:-Ollama}
      Llm__Model: ${LLM_MODEL:-qwen2.5:3b}
      Llm__BaseUrl: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__TimeoutSeconds: ${LLM_TIMEOUT_SECONDS:-120}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-no-reply@edumonitor.local}
      Smtp__UseStartTls: ${SMTP_STARTTLS:-false}
      Reportes__Periodo: ${REPORTE_PERIODO:-Primer parcial}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama instalado en el equipo (Windows/Mac/Linux)
    ports: ["5003:8080"]

  gateway:        # API Gateway (YARP)
    build:
      context: .
      dockerfile: src/Gateway/EduMonitor.Gateway/Dockerfile
    container_name: em-gateway
    depends_on: [identity-api, academic-api, analytics-api]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity-api:8080/
      ReverseProxy__Clusters__academic__Destinations__d1__Address: http://academic-api:8080/
      ReverseProxy__Clusters__analytics__Destinations__d1__Address: http://analytics-api:8080/
      ReverseProxy__Clusters__analytics__HttpRequest__ActivityTimeout: "00:04:00"
      Cors__Origins__0: http://localhost:5174
      Cors__Origins__1: http://localhost:5173
    ports: ["5000:8080"]

  # ---------------- Frontend React ----------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: em-frontend
    depends_on: [gateway]
    ports: ["5174:80"]

volumes:
  sqlserver_data:
  mariadb_data:
  moodle_data:
  moodledata_data:
  ollama_data:

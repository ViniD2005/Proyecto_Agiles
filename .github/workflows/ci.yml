name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend .NET 8 (build + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore EduMonitor.sln
      - run: dotnet build EduMonitor.sln --no-restore -c Release
      - run: dotnet test EduMonitor.sln --no-build -c Release --logger "trx;LogFileName=resultados.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: '**/TestResults/*.trx'

  frontend:
    name: Frontend React (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
